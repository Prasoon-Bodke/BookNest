<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Manage your personal book collection. Track reading status, add ratings and notes, and organize your reading list.">
  <title>My Shelf - BookNest</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Site Header with Navigation -->
  <header class="site-header">
    <div class="header-container">
      <a href="index.html" class="site-logo">📚 BookNest</a>

      <!-- Mobile menu toggle button -->
      <button class="menu-toggle" aria-label="Toggle navigation menu" aria-expanded="false">
        Menu
      </button>

      <!-- Main Navigation -->
      <nav class="site-nav" aria-label="Main navigation">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="search.html">Search Books</a></li>
          <li><a href="shelf.html" class="active" aria-current="page">My Shelf</a></li>
          <li><a href="about.html">About</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container">
    <section class="mt-xl mb-lg">
      <h1>My Shelf</h1>
      <p class="text-muted">Your personal reading list</p>
    </section>

    <!-- Filter tabs -->
    <nav class="shelf-filters mb-xl" aria-label="Filter shelf by status">
      <button class="filter-btn active" data-filter="all" aria-current="true">
        All Books
      </button>
      <button class="filter-btn" data-filter="to-read">
        Want to Read
      </button>
      <button class="filter-btn" data-filter="reading">
        Currently Reading
      </button>
      <button class="filter-btn" data-filter="finished">
        Finished
      </button>
    </nav>

    <!-- Shelf container - books will be loaded here -->
    <section id="shelf-container">
      <div class="card text-center">
        <p class="text-muted">Loading your shelf...</p>
      </div>
    </section>
  </main>

  <!-- Site Footer -->
  <footer class="site-footer">
    <div class="footer-container">
      <p>&copy; 2026 BookNest.</p>
      <p>Powered by <a href="https://openlibrary.org/" target="_blank" rel="noopener">Open Library API</a></p>
    </div>
  </footer>

  <!-- JavaScript for mobile menu toggle -->
  <script>
    // Mobile menu toggle functionality
    const menuToggle = document.querySelector('.menu-toggle');
    const siteNav = document.querySelector('.site-nav');

    menuToggle.addEventListener('click', function() {
      const isOpen = siteNav.classList.toggle('open');
      menuToggle.setAttribute('aria-expanded', isOpen);
    });
  </script>

  <!-- Shelf functionality - ES6 module -->
  <script type="module" src="js/shelf.js"></script>
</body>
</html>
